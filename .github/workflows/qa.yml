name: Guide Telemetry QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: JavaScript runtime and privacy tests
        run: node tests/runtime.test.cjs

      - name: PHP enqueue contract tests
        run: php -d zend.assertions=1 -d assert.exception=1 tests/php-enqueue.test.php

      - name: PHP syntax
        run: php -l plugin/guide-telemetry/guide-telemetry.php

      - name: JavaScript syntax
        run: node --check plugin/guide-telemetry/assets/guide-telemetry.js
